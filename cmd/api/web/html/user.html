{{ define "content" }}
<section class="card">
  <div class="toolbar">
    <button id="reload">Reload</button>
    <button data-toggle-column="fetchID">Toggle fetch ID</button>
    <button data-toggle-column="divisionName">Toggle division</button>
    <button
      data-toggle-column="rankedSoloMovingGames,rankedSoloMovingWins,rankedSoloNomoveGames,rankedSoloNomoveWins,rankedSoloNmpzGames,rankedSoloNmpzWins"
    >
      Toggle Ranked
    </button>
    <button
      data-toggle-column="rankedTeamMovingGames,rankedTeamMovingWins,rankedTeamNomoveGames,rankedTeamNomoveWins,rankedTeamNmpzGames,rankedTeamNmpzWins"
    >
      Toggle Team
    </button>
    <button
      data-toggle-column="unrankedSoloMovingGames,unrankedSoloMovingWins,unrankedSoloNomoveGames,unrankedSoloNomoveWins,unrankedSoloNmpzGames,unrankedSoloNmpzWins"
    >
      Toggle Unranked
    </button>
    <!-- TODO: replace it with matrix of checkboxes allowing to select each (ranked/unranked/team) x (moving/nomove/nmpz) separately + store setting in cookie or user storage -->
  </div>

  <div id="status" class="status"></div>
  <div id="user-history-table"></div>
</section>
{{ end }} {{ define "scripts" }}
<script>
  window.GGWD_PAGE = {
    id: {{ .ID }}
  };
</script>
<script type="module" src="/static/pages/user.js"></script>
{{ end }}
