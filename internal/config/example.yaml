---
database:
  url: postgres://app:app@postgres-app:5432/app?sslmode=disable

temporal:
  address: temporal:7233
  namespace: default
  taskQueue: ggwd-task-queue
  # FIXME: auth

geoguessrApi:
  baseUrl: https://www.geoguessr.com/api
  cookie: cookie
  proxy: http://gluetun:8888  # or leave empty for no proxy
  timeoutSeconds: 30

notifierApi:
  shoutrrr: []  # see https://containrrr.dev/shoutrrr/v0.8/services/discord/
  #  - "discord://webhook_token@webhook_id"

watchdogs:
  CompetitiveMaps:
    enabled: true
    scheduleFrequencyHours: 6
    notifyAbout:
      - divisionName: "Master I"
        gameMode: "standardDuels"  # "standardDuels", "noMoveDuels", "nmpzDuels"
    temporalAdvanced:
      workflowName: "GGWDCompetitiveMapsWorkflow"
      fanoutActivity:
        startToCloseTimeoutSeconds: 60
        retryInitialIntervalSeconds: 5
        retryBackoffCoefficient: 2
        retryMaximumIntervalSeconds: 60
        retryMaximumAttempts: 5
      parallelism: 2
  UserStats:
    enabled: true
    scheduleDaily:  # UTC time
      hour: 4
      minute: 0
    observeUsers:
      - user_id  # user ID, not login
    temporalAdvanced:
      workflowName: "GGWDUserStatsWorkflow"
      fanoutActivity:
        startToCloseTimeoutSeconds: 60
        retryInitialIntervalSeconds: 5
        retryBackoffCoefficient: 2
        retryMaximumIntervalSeconds: 60
        retryMaximumAttempts: 5
      parallelism: 2
