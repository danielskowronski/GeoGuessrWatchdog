{{- if .Values.api.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shared.apiGeneratedConfigSecretName }}
  labels:
    {{- include "stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.api.config.generatedConfigFilename }}: |
    database:
      url: {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=disable" .Values.postgres.worker.username (include "stack.secretValue" (list .Values.shared.dbUsersSecretName "worker-password" .Values.postgres.worker.password .)) .Values.postgres.host (.Values.postgres.port | int) .Values.postgres.worker.database | quote }}
    server:
      bind: ":{{ .Values.api.port }}"
    {{- if .Values.api.config.userAliases }}
    userAliases:
      {{- range $key, $value := .Values.api.config.userAliases }}
      {{ $key | quote }}: {{ $value | quote }}
      {{- end }}
    {{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stack.fullname" . }}-api
  labels:
    {{- include "stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      containers:
        - name: api
          image: "{{ include "ggwd.image" . }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:  
            - name: http
              containerPort: {{ .Values.api.port }}
          {{- with .Values.api.command }}
          command: {{ toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.args }}
          args: {{ toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: GGWD_CONFIG_PATH
              value: >-
                {{ .Values.api.config.generatedConfigDir }}/{{ .Values.api.config.generatedConfigFilename }}
                {{- range .Values.api.config.extraSecrets }}
                {{- range .items }}
                ,{{ .diskPath }}/{{ .secretKey }}
                {{- end }}
                {{- end }}
            {{- range $k, $v := .Values.api.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          volumeMounts:
            - name: generated-config
              mountPath: {{ .Values.api.config.generatedConfigDir }}/{{ .Values.api.config.generatedConfigFilename }}
              subPath: {{ .Values.api.config.generatedConfigFilename }}
              readOnly: true
            {{- range .Values.api.config.extraSecrets }}
            - name: {{ .name }}
              mountPath: {{ .diskPath }}
              subPath: {{ .secretKey }}
              readOnly: true
            {{- end }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          {{- if .Values.api.healthchecks.startup.enabled }}
          startupProbe:
            httpGet:
              path: /livez
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ .Values.api.healthchecks.startup.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.api.healthchecks.startup.timeoutSeconds }}
            periodSeconds: {{ .Values.api.healthchecks.startup.periodSeconds }}
            successThreshold: {{ .Values.api.healthchecks.startup.successThreshold }}
            failureThreshold: {{ .Values.api.healthchecks.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.api.healthchecks.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /livez
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ .Values.api.healthchecks.liveness.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.api.healthchecks.liveness.timeoutSeconds }}
            periodSeconds: {{ .Values.api.healthchecks.liveness.periodSeconds }}
            successThreshold: {{ .Values.api.healthchecks.liveness.successThreshold }}
            failureThreshold: {{ .Values.api.healthchecks.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.api.healthchecks.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.port }}
            initialDelaySeconds: {{ .Values.api.healthchecks.readiness.initialDelaySeconds }}
            timeoutSeconds: {{ .Values.api.healthchecks.readiness.timeoutSeconds }}
            periodSeconds: {{ .Values.api.healthchecks.readiness.periodSeconds }}
            successThreshold: {{ .Values.api.healthchecks.readiness.successThreshold }}
            failureThreshold: {{ .Values.api.healthchecks.readiness.failureThreshold }}
          {{- end }}
      volumes:
        - name: generated-config
          secret:
            secretName: {{ .Values.shared.apiGeneratedConfigSecretName }}
        {{- range .Values.api.config.extraSecrets }}
        - name: {{ .name }}
          secret:
            secretName: {{ .secretName }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stack.fullname" . }}-api
  labels:
    {{- include "stack.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "stack.fullname" . }}-api
  labels:
    {{- include "stack.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.api.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.api.ingress.className | quote }}
  rules:
    - host: {{ .Values.api.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "stack.fullname" . }}-api
                port:
                  name: http
  {{- with .Values.api.ingress.tls }}
  tls: {{ toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
