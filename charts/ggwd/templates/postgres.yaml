---
apiVersion: v1
kind: Secret
metadata:
  name: ggwd-postgres-initdb
  labels:
    {{- include "stack.labels" . | nindent 4 }}
type: Opaque
stringData:
  00-users-and-dbs.sql: |
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgres.temporal.username }}') THEN
        CREATE ROLE {{ .Values.postgres.temporal.username }} LOGIN PASSWORD '{{ include "stack.secretValue" (list .Values.shared.dbUsersSecretName "temporal-password" .Values.postgres.temporal.password .) }}';
      ELSE
        ALTER ROLE {{ .Values.postgres.temporal.username }} WITH PASSWORD '{{ include "stack.secretValue" (list .Values.shared.dbUsersSecretName "temporal-password" .Values.postgres.temporal.password .) }}';
      END IF;
      IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = '{{ .Values.postgres.worker.username }}') THEN
        CREATE ROLE {{ .Values.postgres.worker.username }} LOGIN PASSWORD '{{ include "stack.secretValue" (list .Values.shared.dbUsersSecretName "app-password" .Values.postgres.worker.password .) }}';
      ELSE
        ALTER ROLE {{ .Values.postgres.worker.username }} WITH PASSWORD '{{ include "stack.secretValue" (list .Values.shared.dbUsersSecretName "app-password" .Values.postgres.worker.password .) }}';
      END IF;
    END
    $$;
    SELECT 'CREATE DATABASE {{ .Values.postgres.temporal.database }} OWNER {{ .Values.postgres.temporal.username }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.postgres.temporal.database }}')\gexec
    SELECT 'CREATE DATABASE {{ .Values.postgres.temporal.visibilityDatabase }} OWNER {{ .Values.postgres.temporal.username }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.postgres.temporal.visibilityDatabase }}')\gexec
    SELECT 'CREATE DATABASE {{ .Values.postgres.worker.database }} OWNER {{ .Values.postgres.worker.username }}' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = '{{ .Values.postgres.worker.database }}')\gexec

---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shared.postgresAdminAuthSecretName }}
  labels:
    {{- include "stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  postgres-password: {{ include "stack.secretValue" (list .Values.shared.postgresAdminAuthSecretName "postgres-password" .Values.postgres.adminPassword .) | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.shared.dbUsersSecretName }}
  labels:
    {{- include "stack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  worker-password: {{ include "stack.secretValue" (list .Values.shared.dbUsersSecretName "worker-password" .Values.postgres.worker.password .) | quote }}
  temporal-password: {{ include "stack.secretValue" (list .Values.shared.dbUsersSecretName "temporal-password" .Values.postgres.temporal.password .) | quote }}
  worker-database-url: {{ printf "postgres://%s:%s@%s:%v/%s?sslmode=disable" .Values.postgres.worker.username (include "stack.secretValue" (list .Values.shared.dbUsersSecretName "worker-password" .Values.postgres.worker.password .)) .Values.postgres.host (.Values.postgres.port | int) .Values.postgres.worker.database | quote }}
